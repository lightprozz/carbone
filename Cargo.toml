[package]
name = "carbone"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Native Rust document generation from Carbone templates (migration preview)"
license-file = "LICENSE.md"
readme = "doc/RUST.md"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
md5 = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"
wait-timeout = "0.2"
zip = { version = "6", default-features = false, features = ["deflate"] }
